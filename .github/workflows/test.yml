name: Run Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:


jobs:

  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13" ] # 3.10', '3.11', '3.12',
    steps:
      - uses: ./.github/actions/test
        with:
          python-version: ${{ matrix.python-version }}