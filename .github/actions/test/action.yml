name: Run Tests
description: Install dependencies and run the test suite with just

inputs:
  python-version:
    description: Python version to use for tests
    required: false
    default: '3.13'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install just
      uses: extractions/setup-just@v2
    - name: Use uv with Python version
      run: uv venv --python ${{ inputs.python-version }}
      shell: bash
    - name: Install dependencies
      run: just install
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
    - name: Build
      env:
        VERSION: 0.0.1
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: just build
      shell: bash
    - name: Run tests
      run: just test
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
